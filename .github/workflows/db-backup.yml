name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run pg_dump
        run: |
          DATE=$(date +%Y-%m-%d)
          pg_dump "${{ secrets.DATABASE_URL }}" > "backup-${DATE}.sql"

      - name: Compress backup
        run: |
          DATE=$(date +%Y-%m-%d)
          gzip "backup-${DATE}.sql"

      - name: Clone private backup repo
        run: |
          git clone "https://x-access-token:${{ secrets.BACKUP_REPO_TOKEN }}@${{ secrets.BACKUP_REPO_URL }}" backup-repo

      - name: Copy backup into repo
        run: |
          DATE=$(date +%Y-%m-%d)
          cp "backup-${DATE}.sql.gz" backup-repo/

      - name: Commit and push
        run: |
          DATE=$(date +%Y-%m-%d)
          cd backup-repo
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add "backup-${DATE}.sql.gz"
          git commit -m "backup: ${DATE}"
          git push
