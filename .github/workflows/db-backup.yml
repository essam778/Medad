name: Database Backup

on:
  schedule:
    - cron: "0 2 * * 5" # يعمل أسبوعياً يوم الجمعة الساعة 2 صباحاً
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Run pg_dump using Docker (Postgres 17)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is empty. Please set it in GitHub repository secrets."
            exit 1
          fi
          DATE=$(date +%Y-%m-%d)
          docker run --rm postgres:17-alpine pg_dump "$DATABASE_URL" > "backup-${DATE}.sql"

      - name: Compress backup
        run: |
          DATE=$(date +%Y-%m-%d)
          gzip "backup-${DATE}.sql"

      - name: Clone private backup repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO_URL: ${{ secrets.BACKUP_REPO_URL }}
        run: |
          if [ -z "$BACKUP_REPO_TOKEN" ] || [ -z "$BACKUP_REPO_URL" ]; then
            echo "Error: BACKUP_REPO_TOKEN or BACKUP_REPO_URL secret is empty. Please set them."
            exit 1
          fi
          # Remove https:// or http:// if present in the URL
          CLEAN_URL=$(echo "$BACKUP_REPO_URL" | sed -e 's|^https://||' -e 's|^http://||')
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@${CLEAN_URL}" backup-repo

      - name: Copy backup into repo
        run: |
          DATE=$(date +%Y-%m-%d)
          cp "backup-${DATE}.sql.gz" backup-repo/

      - name: Commit and push
        run: |
          DATE=$(date +%Y-%m-%d)
          cd backup-repo
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add "backup-${DATE}.sql.gz"
          git commit -m "backup: ${DATE}" || echo "No changes to commit"
          git push
